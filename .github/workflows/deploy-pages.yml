name: Publish CN Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cn-mirror-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out mirror artifact
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify portable build
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict artifact/SHA256SUMS
          cat artifact/part-* > NBW_PORTABLE_STATIC_BUILD_R0_B2.tar.gz
          echo "a9224f888300714c0a9cfe0e02db68fbf8caf4cd302c6d692644c8b7431566e9  NBW_PORTABLE_STATIC_BUILD_R0_B2.tar.gz" | sha256sum --check --strict
          mkdir _site
          tar -xzf NBW_PORTABLE_STATIC_BUILD_R0_B2.tar.gz -C _site
          test -f _site/index.html
          test -f _site/read/index.html
          test -f _site/characters/index.html
          test -f _site/map/index.html
          test -f _site/NBW_PORTABLE_BUILD_MANIFEST.json
          test -f _site/.nojekyll

      - name: Publish verified files to legacy Pages source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .mirror-generated-files ]]; then
            while IFS= read -r generated_file; do
              rm -f -- "${generated_file}"
            done < .mirror-generated-files
          fi
          rsync -a _site/ ./
          find _site -type f -printf '%P\n' | LC_ALL=C sort > .mirror-generated-files
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No mirror change to publish."
            exit 0
          fi
          git commit -m "Publish generated CN mirror site"
          git push origin HEAD:main
